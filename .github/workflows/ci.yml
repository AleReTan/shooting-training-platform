name: CI

# Пуши в main уже прогоняют тесты и сборку в deploy.yml —
# здесь только пул-реквесты, чтобы не гонять цепочку дважды.
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
